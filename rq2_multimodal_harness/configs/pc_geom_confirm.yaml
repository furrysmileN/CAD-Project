schema_version: rq2.pc_geom_confirm.v1
seed: 42
n: 100
# 筛选冻结的 8 条件；P_geom_static 已去掉。
conditions:
  - I1
  - P_proj
  - P_geom_tool
  - I1P_proj
  - I1P_geom
  - T1I1
  - T1I1P_proj
  - T1I1P_geom

# 100 样本复用 confirm / pilot_v2 冻结清单（与 RQ2b C 臂同一批）。
# I1 = 该清单的 4 张 RGB（view_0/2/4/6）；P_proj = 同源 2048 点 depth-contour；
# T1 = text.L1；P_geom = 同路径 2048 .npy 的 PointEvidence v1。
paths:
  manifest: experiments/rq2_multimodal_harness/outputs/pilot_v2/manifest.jsonl
  output_root: experiments/rq2_multimodal_harness/outputs/native_pointcloud_v1/confirm_n100
  evidence_dir: experiments/rq2_multimodal_harness/outputs/native_pointcloud_v1/evidence
  pointcloud_root: processed/point_clouds/benchcad

arms:
  C:
    plan_version: v3
    repair:
      version: harnesscad.repair.v2.1
      setting: R4
      rules: [number, rotate_revolve, unit_axis, polygon]
    feedback:
      arm: C
      enabled: true
      max_rounds: 2
      sources: [schema, execution]
      round2_temperature: 0.3
      keep_best: true

modalities:
  image_max_edge: 1024

prompt:
  plan_version: v3
  max_operations: 64

pointcloud:
  density: 2048
  seed: 42
  normals_k: 16
  plane_tolerance: 0.012
  plane_max_planes: 2
  section_thickness: null
  symmetry_tolerance: 0.015
  symmetry_sample: 512

tools:
  max_pre_queries: 3
  max_post_queries: 1
  timeout_sec: 8

api:
  env_api_key: VLM_API_KEY
  env_base_url: VLM_BASE_URL
  env_model: VLM_MODEL
  default_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  default_model: qwen3.8-max
  timeout_sec: 180
  max_retries: 3
  retry_base_sec: 2
  request_interval_sec: 5
  temperature: 0
  max_tokens: 4096
  json_mode: true
  extra_body: {enable_thinking: false}

backend:
  episode_version: v2
  root: HarnessCAD/HarnessCAD
  timeout_sec: 30

scoring:
  point_samples: 2048
  voxel_resolution: 48
  failure_aware_tau: 0.25
