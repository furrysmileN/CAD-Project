schema_version: rq2.harness_geometry.v6.pilot.v1
seed: 20260901
n: 3
sample_ids:
  - slotted_plate_000582_s20260505
  - cable_routing_panel_000536_s20260505
  - pipe_elbow_000924_s20260505
repeats: 1
repeat_ids: [1]
conditions:
  - I1P_geom
  - P_geom

# Frozen before the first v6 API call. The two non-path samples are false-positive guards;
# the path sample tests reference selection and deterministic binding.
gates:
  offline:
    schema_and_compiler_tests: pass
    synthetic_arc_radius_abs_error_max: 0.02
    solid_false_positive_count_max: 0
    real_path_oracle_joint_quality_min: 0.75
  live:
    execution_success_rate_min: 1.0
    non_path_binding_count_max: 0
    path_binding_count_min: 2
    pipe_elbow_joint_quality_min: 0.70
    pipe_elbow_delta_vs_v5_i1p_min: 0.40
  stop_if_any_live_gate_fails: true

paths:
  manifest: experiments/rq2_multimodal_harness/outputs/v5_complementarity/manifest_new100.jsonl
  output_root: experiments/rq2_multimodal_harness/outputs/harness_geometry_v6_pilot
  evidence_dir: experiments/rq2_multimodal_harness/outputs/v5_complementarity/evidence
  pointcloud_root: processed/point_clouds/benchcad

arms:
  C:
    plan_version: v6
    repair:
      version: harnesscad.repair.v2.1
      setting: R4
      rules: [number, rotate_revolve, unit_axis, polygon]
    feedback:
      arm: C
      enabled: true
      max_rounds: 2
      sources: [schema, execution]
      round2_temperature: 0.3
      keep_best: true
      plan_prompt_version: v6

modalities:
  image_max_edge: 1024

pointcloud:
  density: 2048
  seed: 42
  normals_k: 16
  plane_tolerance: 0.012
  plane_max_planes: 2
  section_thickness: null
  symmetry_tolerance: 0.015
  symmetry_sample: 512

tools:
  max_pre_queries: 3
  max_post_queries: 1
  timeout_sec: 8

api:
  env_api_key: VLM_API_KEY
  env_base_url: VLM_BASE_URL
  env_model: VLM_MODEL
  default_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  default_model: qwen3.8-max
  timeout_sec: 180
  max_retries: 3
  retry_base_sec: 2
  request_interval_sec: 5
  temperature: 0
  max_tokens: 4096
  json_mode: true
  extra_body: {enable_thinking: false}

backend:
  episode_version: v2
  root: HarnessCAD/HarnessCAD
  timeout_sec: 30

scoring:
  point_samples: 2048
  voxel_resolution: 48
  failure_aware_tau: 0.25
  primary_geometry: common_frame_cd
