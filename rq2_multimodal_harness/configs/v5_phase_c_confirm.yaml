schema_version: rq2.v5.phase_c.v1
seed: 20260818
n: 100
repeats: 3
repeat_ids: [1, 2, 3]
control_conditions: [I1P_proj, I1P_shuffle]
control_repeat: 1
conditions:
  - P_proj
  - P_geom
  - I1
  - I1P_geom
  - T1I1
  - T1I1P_geom
  - T2I1
  - T2I1P_geom
  - I1P_proj
  - I1P_shuffle

paths:
  manifest: experiments/rq2_multimodal_harness/outputs/v5_complementarity/manifest_new100.jsonl
  output_root: experiments/rq2_multimodal_harness/outputs/v5_complementarity/repeats
  evidence_dir: experiments/rq2_multimodal_harness/outputs/v5_complementarity/evidence
  pointcloud_root: processed/point_clouds/benchcad
  shuffle_mapping: experiments/rq2_multimodal_harness/outputs/v5_complementarity/controls/shuffle_mapping.json

arms:
  C:
    plan_version: v3
    repair:
      version: harnesscad.repair.v2.1
      setting: R4
      rules: [number, rotate_revolve, unit_axis, polygon]
    feedback:
      arm: C
      enabled: true
      max_rounds: 2
      sources: [schema, execution]
      round2_temperature: 0.3
      keep_best: true

modalities:
  image_max_edge: 1024

pointcloud:
  density: 2048
  seed: 42
  normals_k: 16
  plane_tolerance: 0.012
  plane_max_planes: 2
  section_thickness: null
  symmetry_tolerance: 0.015
  symmetry_sample: 512

tools:
  max_pre_queries: 3
  max_post_queries: 1
  timeout_sec: 8

api:
  env_api_key: VLM_API_KEY
  env_base_url: VLM_BASE_URL
  env_model: VLM_MODEL
  default_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  default_model: qwen3.8-max
  timeout_sec: 180
  max_retries: 3
  retry_base_sec: 2
  request_interval_sec: 5
  temperature: 0
  max_tokens: 4096
  json_mode: true
  extra_body: {enable_thinking: false}

backend:
  episode_version: v2
  root: HarnessCAD/HarnessCAD
  timeout_sec: 30

scoring:
  point_samples: 2048
  voxel_resolution: 48
  failure_aware_tau: 0.25
  primary_geometry: common_frame_cd
