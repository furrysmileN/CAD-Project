schema_version: rq2.v6b.probe.live.v1
seed: 20260827
split: probe
n: 11
repeats: 2
repeat_ids: [1, 2]
conditions: [C0, C1, C2, C3, C4, C5]
eligible_only: true

paths:
  manifest: experiments/rq2_multimodal_harness/outputs/v6_information_complementarity/pilot_v2_minimal_pairs/manifest_probe.jsonl
  output_root: experiments/rq2_multimodal_harness/outputs/v6_information_complementarity/pilot_v2_minimal_pairs
  latent_dir: experiments/rq2_multimodal_harness/outputs/v6_information_complementarity/pilot_v2_minimal_pairs/latent_specs

arms:
  C:
    plan_version: v3
    repair:
      version: harnesscad.repair.v2.1
      setting: R4
      rules: [number, rotate_revolve, unit_axis, polygon]
    feedback:
      arm: C
      enabled: true
      max_rounds: 2
      sources: [schema, execution]
      round2_temperature: 0.3
      keep_best: false

api:
  env_api_key: VLM_API_KEY
  env_base_url: VLM_BASE_URL
  env_model: VLM_MODEL
  default_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  default_model: qwen3.8-max
  timeout_sec: 180
  max_retries: 3
  retry_base_sec: 2
  request_interval_sec: 5
  temperature: 0
  max_tokens: 4096
  json_mode: true
  extra_body: {enable_thinking: false}

backend:
  episode_version: v2
  root: HarnessCAD/HarnessCAD
  timeout_sec: 30

scoring:
  point_samples: 2048
  seed: 42
  voxel_resolution: 48
  failure_aware_tau: 0.25
  primary_geometry: joint_quality
  primary_feature: critical_feature
  primary_endpoint: first_attempt
