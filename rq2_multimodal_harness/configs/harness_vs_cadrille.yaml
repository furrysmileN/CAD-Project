schema_version: rq2.hvc.v1
seed: 20260829
n: 40
repeats: 1
repeat_ids: [1]
arms:
  - cadrille_rl
  - qwen_raw
  - qwen_harness
model_id: qwen3.8-max

paths:
  manifest: experiments/rq2_multimodal_harness/outputs/harness_vs_cadrille/manifest_n40.jsonl
  output_root: experiments/rq2_multimodal_harness/outputs/harness_vs_cadrille/cut2_live
  cadrille_predictions: experiments/rq2_multimodal_harness/outputs/harness_vs_cadrille/cadrille_runs/predictions_img
  cadrille_pc_predictions: experiments/rq2_multimodal_harness/outputs/harness_vs_cadrille/cadrille_runs/predictions_pc

api:
  env_api_key: VLM_API_KEY
  env_base_url: VLM_BASE_URL
  env_model: VLM_MODEL
  default_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  default_model: qwen3.8-max
  timeout_sec: 360
  max_retries: 2
  retry_base_sec: 2
  request_interval_sec: 2
  temperature: 0
  max_tokens: 4096
  json_mode: true
  extra_body: {enable_thinking: false}

harness:
  plan_version: v5
  repair:
    version: harnesscad.repair.v2.1
    setting: R4
    rules: [number, rotate_revolve, unit_axis, polygon]
  feedback:
    arm: C
    enabled: true
    max_rounds: 2
    sources: [schema, execution]
    round2_temperature: 0.3
    keep_best: true
    plan_prompt_version: v5

backend:
  episode_version: v2
  root: HarnessCAD/HarnessCAD
  timeout_sec: 30

sandbox:
  timeout_sec: 30

scoring:
  point_samples: 2048
  voxel_resolution: 48
  failure_aware_tau: 0.25

modalities:
  image_max_edge: 512

cut3:
  second_model: qwen3-vl-plus
  expand_n: 100
  jq_delta_gate: 0.03
